# ============================================================
# FlowAI Studio - 本地开发 / 验收环境（非生产部署模板）
# ============================================================
# 用法:
#   1. 复制 .env.example 为 .env，并替换所有占位值
#   2. docker compose up -d
#
# 安全边界:
# - 仅绑定本机回环地址，Redis 未启用认证，不能直接用于公网或生产环境
# - 生产部署必须使用 Secret Manager、TLS、独立网络、备份和正式监控
# - 演示 Seed 默认关闭；仅可在 development 环境显式开启
#
# 架构:
#   Nginx(Frontend) → Backend(API) → PostgreSQL + pgvector
#                                    → Redis
# ============================================================

version: '3.8'

services:
  # ============================================================
  # PostgreSQL + pgvector — 主数据库 + 向量存储
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flowai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: flowai_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 自动启用 pgvector 扩展
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowai_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — 缓存 + 会话 + 限流
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: flowai-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Database init — 先迁移，再写入可重复执行的演示数据
  # ============================================================
  db-migrate:
    build:
      context: ./flowai-studio-backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/flowai_studio?schema=public"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-seed:
    build:
      context: ./flowai-studio-backend
      dockerfile: Dockerfile
      target: builder
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/flowai_studio?schema=public"
      ALLOW_DEMO_SEED: "${ALLOW_DEMO_SEED:-false}"
      SEED_ADMIN_USERNAME: "${SEED_ADMIN_USERNAME:-admin}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  # ============================================================
  # Backend — NestJS API 服务
  # ============================================================
  backend:
    build:
      context: ./flowai-studio-backend
      dockerfile: Dockerfile
    container_name: flowai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/flowai_studio?schema=public"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      JWT_EXPIRES_IN: 7d
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY:-${QWEN_API_KEY}}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}
      QWEN_EMBEDDING_DIMENSION: ${QWEN_EMBEDDING_DIMENSION:-1024}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads

  # ============================================================
  # Frontend — Nginx 静态资源服务
  # ============================================================
  frontend:
    build:
      context: ./flowai-studio-frontend
      dockerfile: Dockerfile
    container_name: flowai-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

# ============================================================
# 持久化卷
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
